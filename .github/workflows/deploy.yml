name: Deploy SonarSamaj Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploying via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER || 'root' }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            TARGET_DIR="${{ secrets.TARGET_DIR || '/root/sonarsamajbackend' }}"
            APP_PORT="${{ secrets.PORT || 3001 }}"

            echo "Deploying to directory: $TARGET_DIR on host port: $APP_PORT"

            # Create target directory if it doesn't exist
            mkdir -p $TARGET_DIR
            cd $TARGET_DIR

            # Clone repository if not present; pull if existing
            if [ ! -d ".git" ]; then
              echo "Cloning repository..."
              git clone https://github.com/omkar861856/sonarsamajappbackend.git .
            else
              echo "Fetching latest changes..."
              git fetch origin main
              git reset --hard origin/main
            fi

            # Generate .env configuration file
            echo "Creating .env configuration..."
            cat << EOF > .env
PORT=3000
MONGO_URI=${{ secrets.MONGO_URI || 'mongodb://host.docker.internal:27018/sonar_db' }}
JWT_SECRET=${{ secrets.JWT_SECRET }}
GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
EOF

            # Deploy using Docker with explicit name & port mapping
            echo "Building and launching Docker container sonarsamaj-backend..."
            docker build -t sonarsamaj-backend .

            # Stop and remove existing container if running
            docker stop sonarsamaj-backend || true
            docker rm sonarsamaj-backend || true

            # Run new container, exposing on host port $APP_PORT (default 3001)
            docker run -d \
              --name sonarsamaj-backend \
              --restart always \
              --add-host=host.docker.internal:host-gateway \
              -p $APP_PORT:3000 \
              --env-file .env \
              sonarsamaj-backend

            echo "Deployment successfully completed! App listening on host port $APP_PORT."
