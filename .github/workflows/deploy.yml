name: Deploy SonarSamaj Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Server via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify SSH Secrets
        run: |
          if [ -z "${{ secrets.SSH_HOST }}" ]; then
            echo "ERROR: SSH_HOST secret is missing in GitHub Repository Secrets!"
            exit 1
          fi
          if [ -z "${{ secrets.SSH_KEY }}" ]; then
            echo "ERROR: SSH_KEY secret is missing in GitHub Repository Secrets!"
            exit 1
          fi
          echo "SSH Host and Key secrets verified."

      - name: Execute Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER || 'root' }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e
            TARGET_DIR="/root/sonarsamajbackend"
            APP_PORT="3001"

            echo "Deploying backend to: $TARGET_DIR on port: $APP_PORT"

            mkdir -p $TARGET_DIR
            cd $TARGET_DIR

            if [ ! -d ".git" ]; then
              echo "Cloning backend repository..."
              git clone https://github.com/omkar861856/sonarsamajappbackend.git .
            else
              echo "Pulling latest code..."
              git fetch origin main
              git reset --hard origin/main
            fi

            echo "Writing environment configuration..."
            cat << 'EOF' > .env
PORT=3000
MONGO_URI=mongodb://host.docker.internal:27018/sonar_db
JWT_SECRET=${{ secrets.JWT_SECRET }}
GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
EOF

            echo "Building Docker image..."
            docker build -t sonarsamaj-backend .

            echo "Restarting Docker container..."
            docker stop sonarsamaj-backend || true
            docker rm sonarsamaj-backend || true

            docker run -d \
              --name sonarsamaj-backend \
              --restart always \
              --add-host=host.docker.internal:host-gateway \
              -p $APP_PORT:3000 \
              --env-file .env \
              sonarsamaj-backend

            echo "SUCCESS: SonarSamaj backend is running on port $APP_PORT!"
