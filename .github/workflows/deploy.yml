name: Deploy SonarSamaj Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Server via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify SSH Secrets
        run: |
          if [ -z "${{ secrets.SSH_HOST }}" ]; then
            echo "ERROR: SSH_HOST secret is missing in GitHub Repository Secrets!"
            exit 1
          fi
          if [ -z "${{ secrets.SSH_KEY }}" ]; then
            echo "ERROR: SSH_KEY secret is missing in GitHub Repository Secrets!"
            exit 1
          fi
          echo "SSH Host and Key secrets verified."

      - name: Execute Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script_stop: true
          envs: JWT_SECRET,GEMINI_API_KEY,MONGO_URI
          script: |
            set -x
            set -e
            TARGET_DIR="/root/sonarsamajbackend"
            APP_PORT="3001"

            echo "Deploying backend to $TARGET_DIR..."

            mkdir -p $TARGET_DIR
            cd $TARGET_DIR

            # Ensure clean Git repo fetch (works even if directory is non-empty)
            if [ -d ".git" ]; then
              echo "Fetching latest changes..."
              git fetch origin main
              git reset --hard origin/main
            else
              echo "Initializing Git repo..."
              git init
              git remote add origin https://github.com/omkar861856/sonarsamajappbackend.git || git remote set-url origin https://github.com/omkar861856/sonarsamajappbackend.git
              git fetch origin main
              git reset --hard origin/main
              git branch -M main
            fi

            echo "Generating .env file..."
            echo "PORT=3000" > .env
            if [ -n "$MONGO_URI" ]; then
              echo "MONGO_URI=$MONGO_URI" >> .env
            else
              echo "MONGO_URI=mongodb://host.docker.internal:27018/sonar_db" >> .env
            fi
            echo "JWT_SECRET=$JWT_SECRET" >> .env
            echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env

            echo "Building Docker container..."
            docker build -t sonarsamaj-backend .

            echo "Stopping old container if present..."
            docker stop sonarsamaj-backend || true
            docker rm sonarsamaj-backend || true

            echo "Starting new container..."
            docker run -d \
              --name sonarsamaj-backend \
              --restart always \
              --add-host=host.docker.internal:host-gateway \
              -p $APP_PORT:3000 \
              --env-file .env \
              sonarsamaj-backend

            echo "SUCCESS: SonarSamaj backend is running on port $APP_PORT!"
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
